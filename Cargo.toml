[package]
name = "monoform-wallet"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A minimal, auditable self-custody wallet interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/damianpitt/monoform-wallet"

[dependencies]
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc", "zeroize"] }
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
unicode-normalization = { version = "=0.1.25", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"
