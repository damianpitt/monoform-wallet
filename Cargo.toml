[package]
name = "monoform-wallet"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A minimal, auditable self-custody wallet interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/damianpitt/monoform-wallet"

[features]
# Networking remains an explicit developer opt-in, never enabled by the demo UI.
core-rpc = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:base64", "dep:log"]

[dependencies]
ureq = { version = "=3.4.2", default-features = false, optional = true }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "raw_value"], optional = true }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"], optional = true }
# ureq-proto TRACE dumps raw HTTP bytes, even for sensitive-marked headers.
log = { version = "=0.4.34", default-features = false, features = ["max_level_off"], optional = true }
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc", "zeroize"] }
bip32 = { version = "=0.5.3", default-features = false, features = ["secp256k1"] }
bitcoin_hashes = { version = "=0.14.101", default-features = false }
bech32 = { version = "=0.11.1", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
unicode-normalization = { version = "=0.1.25", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
tempfile = { version = "=3.27.0", default-features = false }

[[example]]
name = "bitcoin_core_status"
required-features = ["core-rpc"]

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"
