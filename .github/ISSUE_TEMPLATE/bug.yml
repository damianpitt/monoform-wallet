name: Bug report
description: Report reproducible non-security behavior
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities or include seeds, private keys, or real wallet data here. Read SECURITY.md instead."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the behavior without sensitive wallet information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use demonstration or testnet data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: sensitive
    attributes:
      label: Sensitive-data check
      options:
        - I confirm this report contains no seed, private key, or real wallet data
    validations:
      required: true
